name: CI
on: [push]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go vet ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.15.0
          args: ./...
